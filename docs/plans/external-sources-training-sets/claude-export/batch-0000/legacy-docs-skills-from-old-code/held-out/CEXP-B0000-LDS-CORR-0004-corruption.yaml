  async function execReorder(
      op: any,
      nodeMap: Map<string, string>
  ): Promise<OpResult> {
      const node = await resolveNode(op.nodeId, nodeMap);
      if (!node) {
          return { nodeId: null, warning: `reorder: node not found — ${op.nodeId}` };
      }
      const parent = node.parent;
      if (!parent || !('insertChild' in parent)) {
          return { nodeId: node.id, warning: `reorder: parent does not support insertChild — ${op.nodeId}` };
      }
      const maxIndex = (parent as FrameNode).children.length - 1;
      const targetIndex = Math.max(0, Math.min(typeof op.index === 'number' ? op.index : 0, maxIndex));
      (parent as FrameNode).insertChild(targetIndex, node);
      return { nodeId: node.id, warning: null };
  }
