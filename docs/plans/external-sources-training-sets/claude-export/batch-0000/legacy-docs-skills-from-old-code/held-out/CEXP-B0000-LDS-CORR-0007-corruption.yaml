  **The three surface fixes in plain terms:**
  
  **Reference image** — score comes off entirely. The reference is a static target mockup. A changing number on it implies the mockup improved or was evaluated, which is false. Nothing replaces it.
  
  **SideBySide** — splits into two explicit visual states (following the `explicit-variants` principle). During `comparing`: the right column shows the canvas being evaluated with a pulsing amber border and "Under evaluation" label — no score yet because it's unknown. During `executing/done`: the dark center bubble disappears, replaced by a verdict bar *under the right column image* that reads `prev: 74/100 ▲12`. The score is now owned by the Figma column, not floating between two unrelated images.
  
  **Iteration log** — each row becomes a before→after card with two thumbnails: left = the canvas Claude scored (`scoredSnapshot`, the new field), right = the canvas the ops built (`canvasSnapshot`). The score badge is physically pinned to the bottom-right corner of the left thumbnail — they are inseparable. The right thumbnail has no badge because it hasn't been scored yet. This makes the causal chain readable: "this canvas scored 74, which caused these ops to run, which produced this canvas."
  
  The **`★ Best` chip** on the best-scoring row is a small bonus that makes it instantly findable without hunting through numbers.
