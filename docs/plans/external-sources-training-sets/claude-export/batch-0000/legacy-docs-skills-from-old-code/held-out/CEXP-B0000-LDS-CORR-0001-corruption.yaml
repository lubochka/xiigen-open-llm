  **One-line fix — `controller.ts`, line 233.**
  
  **Root cause:** `documentAccess: dynamic-page` means the Figma document is *not* loaded at plugin startup — you must explicitly call `figma.loadAllPagesAsync()` before touching any nodes. Every handler already did this correctly:
  
  | Handler | `loadAllPagesAsync()` call |
  |---|---|
  | `request-frame-export` | ✅ first line |
  | `execute-figma-ops` | ✅ first line (+ second after ops) |
  | **`init-design-gen-canvas`** | ❌ **missing** ← bug |
  
  **What was happening:**
  1. `init-design-gen-canvas` called `figma.createFrame()` + `appendChild()` on an unloaded document context → frame was created in a "limbo" state, ID stored in `designGenNodeMap`
  2. `request-frame-export` called `figma.loadAllPagesAsync()` → document reloaded fresh, with no trace of the frame that was created before loading
  3. `figma.getNodeById(rootId)` → `null` → all three fallbacks fail → `dg-frame-error` → "Figma frame export returned no data"
  
  **The fix** adds `await figma.loadAllPagesAsync()` as the first line inside `init-design-gen-canvas`'s try block, before any access to `figma.currentPage.children` or `figma.createFrame()`. This ensures the frame is created inside a properly-loaded document, so `getNodeById` finds it reliably in subsequent handlers.