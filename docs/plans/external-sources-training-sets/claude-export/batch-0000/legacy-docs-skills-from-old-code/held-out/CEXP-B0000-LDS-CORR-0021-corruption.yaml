  Now I understand the restore problem clearly.
  
  The restore just re-runs the ops from that iteration ON TOP of the current canvas state. It doesn't clear the canvas first. So:
  - Iter 3 built nodes A, B, C
  - Iter 4 built nodes D, E, F  
  - Restoring iter 3 re-runs iter 3's ops on the canvas that has A,B,C,D,E,F
  - The upsert guard updates A,B,C in place
  - D,E,F remain → "leftovers"
  
  The fix is: before re-running bestOps, send a `clear-design-gen-canvas` message to the sandbox that removes all children of `design-gen-root` (but keeps the root frame itself).
  
  
  For the placement issue, the doubled numbers in the image suggest the upsert guard is finding multiple nodes with the same name instead of updating a single node, likely because the name lookup isn't properly deduplicating or the nodes weren't cleaned up from previous iterations.
  
  The core issue is that `reset-design-gen-session` clears the nodeMap but leaves the actual Figma nodes untouched, so when a new generation starts, old named elements from the previous run still exist on the canvas. When the upsert tries to find them by name, it either updates one and leaves duplicates, or creates new ones alongside the old ones. The fix is to actually delete those leftover Figma nodes when resetting the session, not just clear the in-memory map.
