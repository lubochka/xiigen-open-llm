  Now I have the full picture:
  
  **Problem 1 — Leftovers on restore:**
  The restore just re-runs `entry.ops` on top of the existing canvas. It doesn't clear the canvas first. So nodes added in later iterations remain. Fix: send a `clear-canvas-children` message to the sandbox before re-running ops.
  
  **Problem 2 — Leftovers from previous sessions / doubled elements:**
  `init-design-gen-canvas` creates a NEW `AI Design Canvas` frame every time, places it to the right of existing content. So when you hit Generate again, a new frame is created. The old frame's nodes stay. But wait - the nodeMap is reset. 
  
  When a new iteration runs and tries to create a frame like `zone-header`, the nodeMap lookup fails since it was cleared. Then `findOne` searches the entire page and finds the old `zone-header` from the previous session's frame, so the upsert updates that stale node instead of creating a fresh one in the new frame. That's the root cause—`findOne` doesn't respect frame boundaries, so it pulls in nodes from old frames that should've been left alone.
  
  The fix is to scope the search: instead of letting `findOne` scan the whole page, I'll make it search only within the `design-gen-root` frame so it can't accidentally grab nodes from previous sessions.
  
