  Build clean. Two root causes fixed, not the symptoms Gemini described.
  
  **Fix 1 — Cross-session ghost nodes (the doubled "834", "872.5K"):** Every `findOne` in `resolveNode`, `execCreateFrame`, and `execCreateRect` now searches within `design-gen-root` first, falling back to page-wide scan only if the root isn't in the map yet. `initDesignCanvas` creates a new frame every run, so previous sessions' frames (and their `zone-header`, `stat-card` etc.) stay on the page indefinitely. The page-wide scan was finding those old nodes and treating them as the current session's — upsert would update them, leaving the new session's frame empty and the old frame corrupted.
  
  **Fix 2 — Restore leftovers:** Both the automatic downgrade-restore and the manual ↩ Restore button now call `clearCanvasChildren()` before replaying ops. This sends `clear-canvas-children` to the sandbox, which removes every child of `design-gen-root` (the 1024×1024 frame stays), waits for `canvas-cleared` confirmation, then re-runs the ops onto a clean slate. No more iter 4 nodes surviving a restore to iter 2.
  
  Gemini's "Fix B: append parent before setting x/y" is already handled — `applyGeometryToExisting` calls `appendChild` then sets `x/y`. The coordinate timing issue it described doesn't exist in the current code.