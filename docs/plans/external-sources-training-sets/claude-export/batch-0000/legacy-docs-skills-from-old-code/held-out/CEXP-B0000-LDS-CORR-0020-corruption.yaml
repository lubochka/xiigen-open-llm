B_wrong: |
     The user found that removing the TWO TIERS coordinate explanation fixed the stacking issue. This means the "fix" we added actually caused the problem — by telling Claude about two different coordinate systems, Claude got confused and started sending wrong coordinates. The original simpler "coordinates are relative to parent" was correct and sufficient.
  
  Let me update the prompt to remove that block and restore the simpler rule.Classic case of an "explanation" making things worse. The original single rule — *"Coordinates: relative to the parent frame's top-left (0,0)"* — was correct and Figma-consistent. Our TWO TIERS addition told Claude to use canvas-absolute coords for zone frames, which is only true when the zone frames are direct children of a zero-origin root. Claude took that as license to send `y=800` for a footer zone, which then placed it at `y=800` relative to `design-gen-root` — correct — but then also sent `y=800` for content *inside* that footer because the "canvas-absolute for zones" rule stuck in its context. Everything stacked at 0,0 because the relative rule for children was being overridden.
