B_correct: |
     The key insight from the code dump is crystal clear: `controller.ts` clears the entire canvas on every iteration (`execute-figma-ops` handler removes all children and resets the nodeMap). This completely contradicts the persistence model in the prompt.
  
  The Gemini analysis is correct. Let me just confirm this is the actual issue and provide a targeted fix plan.Gemini is right. I can see it directly in the code you shared:
  
  ```typescript
  // controller.ts line 220 — runs on EVERY iteration
  for (let i = rootFrame.children.length - 1; i >= 0; i--) {
      rootFrame.children[i].remove();  // wipes the canvas
  }
  designGenNodeMap = new Map();  // loses all node IDs
  ```
  
  The prompt says "frames persist." The controller deletes everything. Claude stops sending `create-frame` ops for the skeleton (because it thinks it exists), the canvas gets wiped, nothing gets built, score stays at 0–25 forever.
  
  **The fix is two surgical changes:**
  
  ---
  
  ### Change 1 — `controller.ts`: Remove the wipe (the critical one)
  
  Replace the clear-and-reset block with a no-op comment:
  
  ```typescript
  if (msg.type === 'execute-figma-ops') {
      try {
          const ops: any[] = Array.isArray(msg.ops) ? msg.ops : [];
  
          // PERSISTENCE MODEL: do NOT clear children or reset the node map.
          // Claude's delta ops (set-fill, set-text, resize) target nodes by name
          // from designGenNodeMap — wiping it here breaks every delta op.
          // The canvas is modified in-place; previous nodes survive between iterations.
  
          await executeOps(ops, designGenNodeMap);
          // ... rest unchanged
  ```
  
  ---
  
  ### Change 2 — `ClaudeComparisonProvider.ts`: Fix the EARLY ITERATIONS instruction
  
  Currently says "Use create-frame and create-rect for containers." Change to:
  
  ```
  EARLY ITERATIONS (score < 40):
    Check CURRENT image first. Only use create-frame if the zone is visibly absent.
    If a zone exists but is wrong, use resize or set-fill to correct it.
    Never recreate a zone that already appears in CURRENT.
  ```
  
  Without this, Claude still sends `create-frame` for zones that exist, which stacks duplicate frames on top of each other now that the canvas isn't cleared.
  
  ---
  
  ### One consequence to handle
  
  Without the wipe, `delete-node` ops become important — when Claude wants to replace something structurally wrong it must explicitly delete it first. Add a note to the RULES section:
  
  ```
  - To replace a wrongly-built element: emit delete-node first, then create-* the replacement
  - Never create a frame with the same name as one that already exists in CURRENT
  ```
  
  ---
  
  That's the entire fix. Two files, ~10 lines total. The plateau at 15–25 will immediately break because the skeleton from iter 1 survives into iter 2, and Claude can spend all 60 ops on content instead of rebuilding structure.
  
  Want me to implement both changes directly?