  Three root causes addressed, not Gemini's symptoms:
  
  ---
  
  **What was actually wrong (not what Gemini said)**
  
  Gemini correctly named the hallucination but blamed it on "phase transition." The actual cause is a design flaw in how scoring works: one model generates ops *and* self-grades them in the same response. That model naturally awards points for applying the typography scale and design tokens — visible improvements by its definition — even when the canvas looks worse to a human. A model that generates "Jan Feb Mar" for chart labels still gives itself full marks for "CONTENT PASS completed."
  
  ---
  
  **Fix 1 — Transcription Rule in CONTENT pass** (`ClaudeComparisonProvider.ts`, `OpenAIComparisonProvider.ts`)
  
  The CONTENT pass now opens with a hard constraint before anything else: *"Copy text labels EXACTLY as they appear in REFERENCE. If REFERENCE shows 'Mon Tue Wed', write those exact characters. Never generate realistic-sounding data."* Then: *"Read PREVIOUS ITERATION GAPS. Address ALL listed gaps before anything else."* — gaps are now mandatory work orders, not FYI hints.
  
  **Fix 2 — Scoring rubric in system prompt** (both providers)
  
  The `score` field now has an explicit deduction table in the system prompt: -15 missing sections, -10 wrong position/size, -10 overlapping, -5 wrong label content, -5 wrong color, -3 missing image. "Do NOT award points for applying design tokens if the visual result diverges from REFERENCE."
  
  **Fix 3 — Independent scoring call** (`ClaudeComparisonProvider.ts`, `OpenAIComparisonProvider.ts`, `DesignGeneratorPanel.tsx`)
  
  After each iteration's ops are applied and the canvas is exported, a *second* API call fires — 512 tokens, rubric-only system prompt, no ops context, no "credit for effort." It scores the updated canvas the same way a human reviewer would. That score replaces the self-reported one. In the API Keys section there's now a **Scoring Mode** toggle: **Independent** (extra call, accurate) vs **Self-reported** (original behavior, faster). Both Claude and GPT-4o have their own scoreOnly implementation.