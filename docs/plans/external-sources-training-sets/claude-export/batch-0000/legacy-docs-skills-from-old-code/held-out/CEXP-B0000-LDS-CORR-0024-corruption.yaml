  Now I have a clear picture. Let me analyze the actual problems:
  
  1. **Score paradox**: Claude scores its own work — same model that generates also evaluates. When in CONTENT phase, it awards points for "applying design tokens" even when it's hallucinating data. The scorer should be stricter.
  
  2. **Semantic hallucination in CONTENT phase**: The CONTENT PASS prompt says "Fill containers with text" — Claude interprets this as "generate realistic content" rather than "transcribe what you see." Need explicit "COPY WHAT YOU SEE" instructions.
  
  3. **The phase threshold is wrong**: Score 20 → CONTENT is too aggressive. 
  
  The skeleton clearly isn't complete by score 20 — those 7 iterations stuck at 15/35 prove it. I need to raise the threshold so the CONTENT phase only starts when the skeleton is actually finished.
  
  4. **Self-scoring bias**: Claude gives itself credit for things that look worse visually. The score doesn't correlate with what the user sees.
  
  To fix this, I should add a transcription rule to the CONTENT pass that explicitly forbids generating realistic-sounding data and instead requires copying text exactly as it appears in the reference. I also need to tighten the scoring instructions so Claude stops awarding points for hallucinated content.
  
  I should make the scoring rubric explicit with specific penalty categories — missing sections, wrong labels, misplaced elements, overlapping elements — instead of letting Claude guess. The `prevNotes` field needs to become a hard requirement rather than just informational, and I need to enforce that every annotation gap from the previous iteration gets addressed with a corresponding operation or an explanation for why it can't be.
  
