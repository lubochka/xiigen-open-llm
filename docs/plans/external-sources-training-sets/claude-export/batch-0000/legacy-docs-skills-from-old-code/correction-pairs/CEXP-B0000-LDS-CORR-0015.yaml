  Two files. Here's the precise diagnosis and what was done vs what Gemini suggested:
  
  ---
  
  **What the report actually shows:** iter 5 has `rect×9` then `move-to-back×8`. Claude *knows* it created shutters — it immediately tried to undo them with `move-to-back`. The problem is the snapshot for scoring is taken *after* ops execute, so the shutter lands, is moved to back, but the score still reflects the partially-recovered state. The prompt already teaches `move-to-back` as recovery — that's why Claude uses it — but it's reactive, not preventive.
  
  **Fix 1 — `op-executor.ts`: proactive shutter guard (Gemini's suggestion B — correct)**
  Any `create-rect` with `w >= 900 && h >= 900` that isn't named `"zone-bg"` is *automatically* placed at index 0 (bottom of stack) immediately on creation, before the frame is exported. Claude never gets a chance to bury anything. Also added the same upsert guard that `execCreateFrame` already has — `create-rect` was the only create op still missing it.
  
  **Fix 2 — `ClaudeComparisonProvider.ts`: one tight rule added to SYSTEM_PROMPT**
  A single "IRON LAW" block after the layer-order section. Short, explicit, and it tells Claude the executor will auto-move large rects anyway — removing any ambiguity about whether it should try to create them. The key line: *"To change the background color: emit `set-fill` on `zone-bg`."* That's the instruction that was completely missing.
  
  **Gemini's suggestion C (TypeScript interface schema) was skipped** — Claude doesn't parse constraint interfaces from prompt text as enforced rules. The executor guard is the enforcement; the prompt text is just the explanation.