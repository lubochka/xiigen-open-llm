  The diagnosis reveals four causes, not one. The suggested approach catches two of them but misses the one that will silently break the fix.
  
  ---
  
  **The four causes in priority order:**
  
  **Cause 1 (biggest)** — The system prompt explicitly tells Claude to "always produce a COMPLETE set of create-* ops for the full layout — never assume any previous elements exist." This is the actual ceiling. By iter 7 with score 65, the structure is already correct — but Claude is spending ops 1–15 recreating frames that already exist, leaving only 15 ops for the details that are actually missing. The fix is to change the mental model: frames with consistent names persist, early iters build skeleton, late iters fix details.
  
  **Cause 2** — 30 ops is too few for a complex dashboard. A complete first-pass needs 25–45 ops minimum. At 30, Claude has to choose between structure and content every iteration, causing the oscillation (15→25→35 instead of a steady climb). The fix is 60 ops — not 80, because at 80 ops the token output approaches the current `MAX_TOKENS: 8192` limit and will regularly trigger JSON truncation/repair.
  
  **Cause 3** — No phase awareness. The user message says the same thing on iter 1 and iter 7. By iter 7 Claude should know it's in refinement mode, not skeleton mode. Passing `prevScore` (already in the codebase but unused) enables phase detection: SKELETON (<40), CONTENT (40–70), REFINEMENT (>70). Combined with `prevNotes` (what was identified as missing last time), this directly addresses the missing chart elements gap.
  
  **Cause 4 (the hidden prerequisite)** — No naming convention. This is what the suggested approach misses entirely, and it's what will silently break the delta-refinement approach. When Claude uses `set-fill { nodeId: "zone-header" }` but created the frame as `header-section` in iter 2, the op executor looks it up in `designGenNodeMap` by name, finds nothing, and silently drops the op. Every delta op becomes a no-op. The persistence model cannot work without consistent names — so Change 4 must be implemented *first*, before testing anything else.
  
  The implementation order: naming convention → ops budget → persistence model prompt → prevNotes plumbing.