  **Three changes, two files:**
  
  **`generateImageWithOpenAI()`** — a new helper in the panel. It picks the right OpenAI model and size based on the node dimensions: `dall-e-2` at 256×256 or 512×512 for small content elements (avatar, thumbnail), `gpt-image-1` at 1024×1024 for larger ones. dall-e-2 at small sizes costs ~$0.016 and returns in ~2s — for an 80px avatar there's no quality difference vs the full-size model.
  
  **`enrichOpsWithImages()` rewrite** — switches from a synchronous `.map()` to `Promise.all(ops.map(async ...))` so all image generations run in parallel. Three filter rules before the OpenAI call: skip nodes where both dimensions exceed 819px (backgrounds), skip queries that are literally "background" or "abstract background", skip if no OpenAI key. Anything that fails the filter falls through to loremflickr silently — no regression.
  
  **The `Uint8Array → Array.from() → new Uint8Array()` round-trip** — Uint8Arrays lose their type through `postMessage` structured clone. `Array.from()` before sending, `new Uint8Array(op.imageBytes)` in the executor (already written this way). Nothing needs to change in the executor.
  
  No changes to the prompt, no changes to the executor, no manifest changes (the UI iframe makes the fetch, not the sandbox).
