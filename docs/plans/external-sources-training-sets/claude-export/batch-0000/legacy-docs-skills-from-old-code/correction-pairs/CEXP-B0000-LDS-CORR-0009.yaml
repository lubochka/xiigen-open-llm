  ---
  
  **Root Cause A — Missing ops (the dominant cause, fully fixable in code)**
  
  When Claude is in Phase 3 trying to correct a text node from 14px to 12px, there is no `set-font-size` op in `VALID_OPS`. The op doesn't exist. Claude has to choose between doing nothing (detail stays wrong) or `delete-node` + `create-text` (wastes 2 ops and loses the node's name from the map). The same gap exists for `set-font-weight`, `set-position`, `set-opacity`, and `set-stroke`. Card borders are missing entirely because there's no way to set them. The fix is to add 5 new op types across `IDesignAiProvider.ts`, `op-executor.ts`, and the SYSTEM_PROMPT schema. Also `create-text` is missing `name`, `fontFamily`, `textAlign`, `lineHeight`, `letterSpacing` — the executor hardcodes `Inter` and ignores everything else. These must exist before any prompt fix can work.
  
  **Root Cause B — Font family hardcoded to Inter**
  
  `op-executor.ts` line 152: `const fontFamily = 'Inter'`. Any `fontFamily` Claude returns is silently ignored. One line fix once the field is added to the op schema.
  
  **Root Cause C — Vision models cannot read exact pixel values from compressed JPEGs**
  
  This is permanent and real. The "mental 8px grid" and "luminosity verification" suggestions are not wrong in intent but they are wrong in mechanism — you cannot improve a vision model's pixel-reading accuracy through prompt instructions. What you can do is make Claude *correct* values iteratively even when it can't read them precisely on first pass. The token extraction idea from the suggestion is correct but implemented differently: instead of a separate API call, add a `tokens` block to the same JSON response. This forces Claude to explicitly state the values it extracted (heading: Inter 24px Bold, accent: #6C63FF) as structured output within the same call, then re-inject those extracted values into the next iteration's message so Claude is validating its own previous measurement rather than re-estimating from scratch. That's chain of thought in its legitimate form: structured intermediate output that actually constrains the final output, rather than free-form "think harder" instructions that consume tokens without effect.