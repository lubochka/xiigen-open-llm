  ## Fix 1 — `op-executor.ts` (code guard — the most important fix)
  
  In `execSetImageFill`, after resolving the node, add a dimension check **before** loading any image. If the node is too large, fall back to a solid fill instead:
  
  ```typescript
  async function execSetImageFill(
      op: any,
      nodeMap: Map<string, string>
  ): Promise<OpResult> {
      const node = await resolveNode(op.nodeId, nodeMap);
      if (!node) {
          return { nodeId: null, warning: `set-image-fill: node not found — ${op.nodeId}` };
      }
      if (!('fills' in node)) {
          return { nodeId: node.id, warning: `set-image-fill: node has no fills — ${node.type}` };
      }
  
      // ── DIMENSION GUARD ─────────────────────────────────────────────────────
      // Never apply image fill to large background-like nodes (>80% of 1024px canvas).
      // Claude often ignores the prompt rule; this is the hard enforcement.
      // Fall back to a neutral solid fill so the background stays clean.
      const CANVAS_SIZE = 1024;
      const MAX_IMAGE_FILL_DIM = CANVAS_SIZE * 0.8; // 819px
      const nodeW = ('width'  in node) ? (node as any).width  : 0;
      const nodeH = ('height' in node) ? (node as any).height : 0;
      if (nodeW > MAX_IMAGE_FILL_DIM && nodeH > MAX_IMAGE_FILL_DIM) {
          // Apply solid fallback color if provided, otherwise white
          const fb = op.fallbackFillColor;
          const r = (fb && typeof fb.r === 'number') ? fb.r : 1;
          const g = (fb && typeof fb.g === 'number') ? fb.g : 1;
          const b = (fb && typeof fb.b === 'number') ? fb.b : 1;
          (node as GeometryMixin).fills = [{ type: 'SOLID', color: { r, g, b } }];
          return { nodeId: node.id, warning: `set-image-fill blocked: node ${op.nodeId} is ${Math.round(nodeW)}×${Math.round(nodeH)} — too large for image fill, applied solid fallback` };
      }
      // ────────────────────────────────────────────────────────────────────────
  
      let image: Image | null = null;
      // ... rest unchanged
  ```
  
