  ---
  
  **Task 1 — Versioned History** (6 phases, 7 tests)
  The storage model uses `ai-history:{designName}:{sceneName}` as the key in `figma.clientStorage`. Two new message types in `controller.ts` (`store-ai-history` / `get-ai-history`) follow the exact same pattern as the existing api-key round-trip. `sceneName` needs to be passed down from `App.tsx` as a new prop — it's already there, just not wired. Max 10 versions per scene, oldest dropped automatically.
  
  **Task 2 — Skill Injection** (3 phases, 7 tests)
  A new file `SkillRegistry.ts` holds distilled rules from `react-best-practices`, `react-native-skills`, and `web-design-guidelines` — only CRITICAL and HIGH impact rules to keep token budget controlled. `buildPrompt()` in `AIService.ts` gets a `skillContext` field. The panel computes which skills apply at generate time based on the active stacks. `fix-design` intentionally skips skill injection — it would pollute the HTML/CSS correction output.
  
  **Task 3 — Feedback** (4 phases, 9 tests)
  Feedback extends `HistoryRecord` — no new storage key. A "Keep history" checkbox controls both history and feedback persistence, stored as a preference via `figma.clientStorage`. Last 5 rated entries are injected into the next prompt as a "Previous Generation Feedback" section — Claude uses them to avoid repeating disliked patterns. Feedback UI only appears after a successful generation and resets on each new generation.
  
  **Task 4 — Stack-Aware Prompt Rebuild** (3 phases, 8 tests)
