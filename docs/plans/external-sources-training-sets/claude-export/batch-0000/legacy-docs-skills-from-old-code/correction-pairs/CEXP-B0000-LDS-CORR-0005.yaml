  ## What's still broken ❌
  
  **Single location: `DesignGeneratorPanel.tsx`, `runIterationLoop`**
  
  The bug is a timing mismatch between what Claude **scores** and what Claude **proposes**.
  
  ```
  Iter 1: Canvas = blank   → Claude scores it → score=0,  proposes ops_A → execute ops_A → Canvas = Design_A
  Iter 2: Canvas = Design_A → Claude scores it → score=80, proposes ops_B → execute ops_B → Canvas = Design_B
  Iter 3: Canvas = Design_B → Claude scores it → score=45, proposes ops_C
  ```
  
  At iter 3: `score=45`, `bestScore=80`, downgrade detected.  
  Current code: `bestOps = ops` saved **when score=80**, meaning `bestOps = ops_B`.  
  `ops_B` is what **created Design_B** (the bad one). Restoring it re-applies the regression.
  
  The fix: save `lastExecutedOps` — the ops that **produced** the currently-scored canvas, not the newly proposed ones.
  
  ---
  
  ## The Fix — `DesignGeneratorPanel.tsx`
  
  **Change 1 — Add `lastExecutedOps` variable** (line after `let bestOps: any[] = []`):
  
  ```typescript
  let lastExecutedOps: any[] = [];   // ops that produced the canvas currently being scored
  ```
  
  **Change 2 — Save `lastExecutedOps` as bestOps** (not `ops`):
  
  ```typescript
  // CURRENT (wrong — saves the new plan, not what made the current good canvas):
  if (score > bestScore && ops.length > 0) {
      bestScore = score;
      bestOps = ops;
  }
  
  // REPLACE WITH:
  if (score > bestScore) {
      bestScore = score;
      bestOps = [...lastExecutedOps];   // what PRODUCED this score, not what Claude just proposed
  }
  ```
  
  **Change 3 — Capture `lastExecutedOps` before executing** (just before `executeOpsAndGetFrame`):
  
  ```typescript
  // CURRENT:
  setPanelState('executing');
  if (ops.length > 0) {
      const updatedFrame = await executeOpsAndGetFrame(ops);
  
  // REPLACE WITH:
  lastExecutedOps = ops;   // record what we're about to execute — scored next iteration
  setPanelState('executing');
  if (ops.length > 0) {
      const updatedFrame = await executeOpsAndGetFrame(ops);
  ```
  
  **Change 4 — Lower downgrade threshold** from `bestScore - 20` to `bestScore - 15` (less tolerant of regression, catches the 80→65 case your logs show):
  
  ```typescript
  // CURRENT:
  const isSignificantDowngrade = bestScore >= 60 && score < bestScore - 20;
  
  // REPLACE WITH:
  const isSignificantDowngrade = bestScore >= 60 && score < bestScore - 15;
  ```
  
