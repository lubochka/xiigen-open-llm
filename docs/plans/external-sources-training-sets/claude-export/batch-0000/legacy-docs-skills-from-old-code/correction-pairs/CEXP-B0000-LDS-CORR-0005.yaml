  The issue is a timing mismatch: when Claude scores the current canvas and proposes new operations, that score reflects what the *previous* iteration built, not what the new proposal will create. So I need to save the ops that were actually executed last time, not the freshly proposed ones.
  
  For iteration 1, there's a bootstrap problem since nothing has executed yet—the initial canvas is blank. The fix is to track `lastExecutedOps`, update `bestOps` to reference what was actually executed rather than the new proposal, and save the current ops before executing them so they become the reference point for the next iteration's scoring.Clear picture. The two async fixes (`getNodeByIdAsync` everywhere) are **already done** in both files. The only unfixed bug is the off-by-one in `DesignGeneratorPanel.tsx`. The document's diagnosis is exactly right. Here's the precise fix plan:
  
  ---
  
  ## What's already fixed ✅
  
  - `controller.ts` — all `getNodeById` → `getNodeByIdAsync` ✅
