  Good catch. The lesson here: **adding explanation to a prompt can be worse than saying nothing**, especially when the explanation introduces a distinction the model has to choose between. Figma's coordinate system is uniformly relative-to-parent — that's one simple rule. Our TWO TIERS block created a two-case decision tree that Claude then applied inconsistently across iterations.
  
  The replacement keeps it honest: *"Zone frames happen to equal canvas pixels because their parent's origin is (0,0) — not because of a special rule."* This way Claude doesn't need to classify each node before deciding which coordinate system to use.
  
