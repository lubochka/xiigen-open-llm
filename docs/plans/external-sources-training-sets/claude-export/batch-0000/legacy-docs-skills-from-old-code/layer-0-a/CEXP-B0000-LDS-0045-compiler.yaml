      Now the image generation is better but still we have fallbacks
  # Design Generation Report
  | Iteration | Score | Ops | Time | Breakdown | Notes |
  |-----------|-------|-----|------|-----------|-------|
  | Iter 1 | 0/100 | 21 ops | 42329ms | rect×2, frame×8, text×10, img×1 | Created basic structure with header, stats cards, chart section, and activity feed area. Avatar placeholder and main content areas established. |
  | Iter 2 | 15/100 | 21 ops | 45853ms | frame×7, text×12, rect×1, img×1 | Created basic structural layout with header zone containing title and avatar area, content zone with stats row and four main sections - weekly activity, activity feed, trends, and about. |
  | Iter 3 | 25/100 | 25 ops | 40809ms | frame×10, rect×2, img×1, text×12 | Created main dashboard structure with proper card layout and positioned avatar illustration. Missing detailed chart content, activity feed items, and trends visualization. |
  | Iter 4 | 25/100 | 22 ops | 38097ms | img×1, set-txt×1, frame×7, text×12, rect×1 | Added stats cards, section containers, and section titles to match the dashboard structure from the reference. |
  | Iter 5 | 25/100 | 25 ops | 41657ms | rect×2, img×1, frame×10, text×12 | Built main structural containers and stat cards with proper spacing, added basic section titles for weekly activity, activity feed, trends and about sections. |
  | Iter 6 | 25/100 | 30 ops | 54409ms | fill×1, resize×2, set-position×1, text×14, img×1, frame×10, rect×1 | Created basic layout structure with header, stats row, and four main content sections. Added placeholder text and basic styling. |
  | Iter 7 | 25/100 | 27 ops | 42517ms | rect×3, move-to-back×1, resize×1, set-position×1, img×1, text×15, frame×5 | Created main structural layout with header, stats row, and four content cards matching the dashboard design. |
  | Iter 8 | 5/100 | 30 ops | 51260ms | rect×10, frame×5, text×14, img×1 | Created basic dashboard structure with header character illustration, stat cards row, main content cards for charts and activity, and bottom trends/about cards. |
  
  Looking at the Iteration 8 score dropping to 5/100, we've officially identified a "Regressive Rebuild" bug. Even though we fixed the image quality, the system is still stuck in a loop where it wipes the canvas and tries to rebuild the "basic structure" over and over.
  Here is why you are still seeing fallbacks and why the score isn't climbing:
  1. The "Silent Fallback" logic is too aggressive
  In `DesignGeneratorPanel.tsx`, there is a rule that triggers the `loremflickr` fallback if the query looks "generic."
  TypeScript
  
  ```
  // src/ui/components/design-gen/DesignGeneratorPanel.tsx
  const isGenericQuery = /^(abstract\s+)?background$/i.test(query.trim());
  
  ```
  
  If Claude sends a prompt starting with "Abstract background for a financial dashboard...", this regex catches it and kills the OpenAI call, falling back to a random stock photo. We should tighten this regex or remove it entirely now that we trust Claude to write better prompts.
  2. The Persistence "Handshake" is broken
  The report shows that even at Iteration 7, Claude is still sending `frame` and `rect` operations (structural skeleton) instead of `set-text` or `set-fill` (detail refinement).
  This happens because of a mismatch in `ClaudeComparisonProvider.ts`. If the `CURRENT` image (the Figma export) looks slightly different than what Claude expects (due to a loading delay or a small rendering glitch), Claude panics, assumes the structure is missing, and tries to "repair" it by creating new nodes. Because your controller is (potentially) still clearing the canvas or not resolving existing nodes correctly, it creates duplicates or ruins the progress.
  3. Iteration 8: The "Reset" Failure
  The drop to 5/100 at Iteration 8 is a classic sign of the "Off-by-one BestOps" bug we discussed earlier.
  * At Iteration 7, it had a decent layout.
  * At Iteration 8, Claude tried to add a detail but failed.
  * The system tried to "Restore" the best version, but because of the bug in `DesignGeneratorPanel.tsx`, it restored the wrong set of operations (likely a blank canvas or a very early skeleton), leading to the 5/100 score.
  The Fix: Tightening the Image Pipeline
  To stop the fallbacks and break the score plateau, apply these two changes:
  A. Fix the Image Logic in `DesignGeneratorPanel.tsx`
  Change the fallback rule to be much more specific, so it only blocks truly empty queries:
  TypeScript
  
  ```
  // Replace Rule 2 in enrichOpsWithImages:
  const isGenericQuery = query.trim().length < 3 || query.toLowerCase() === 'image';
  
  ```
  
  B. Force "Delta-Only" Mode in Claude
  Update your `SYSTEM_PROMPT` in `ClaudeComparisonProvider.ts` to be much more aggressive about persistence. Claude needs to know that deleting or recreating a frame is a failure.
  New Instruction for Claude:
  "You are in REFINEMENT mode. 90% of your operations should be `set-text`, `set-fill`, `resize`, or `set-image-fill`. Only use `create-*` for elements that are physically missing from the CURRENT image. If a frame exists but is the wrong size, DO NOT delete it; use `resize` and `set-position`."
  Would you like me to provide the exact code block to fix the BestOps restoration bug so Iteration 8 doesn't ruin the progress next time?
