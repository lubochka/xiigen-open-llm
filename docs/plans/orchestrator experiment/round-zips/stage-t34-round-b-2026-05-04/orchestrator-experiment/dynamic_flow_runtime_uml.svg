<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img">
  <title>Dynamic flow runtime UML - predicate-level adaptive orchestration</title>
  <desc>Runtime UML for the dynamic flow machine. The semantic compiler translates text and documents into 22-slot predicate vectors before routing, planning, arbiters, transition gates, and learning. Domain tags and phase topology are adaptive registry data, not fixed methodology code.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <style>
      .title { font: 700 24px Segoe UI, Arial, sans-serif; fill: #101828; }
      .lane { font: 700 15px Segoe UI, Arial, sans-serif; fill: #475467; }
      .box-title { font: 700 14px Segoe UI, Arial, sans-serif; fill: #101828; }
      .box-text { font: 12px Segoe UI, Arial, sans-serif; fill: #344054; }
      .small { font: 11px Segoe UI, Arial, sans-serif; fill: #475467; }
      .runtime { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
      .predicate { fill: #ecfdf3; stroke: #039855; stroke-width: 1.5; }
      .gate { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
      .arbiter { fill: #fef3f2; stroke: #d92d20; stroke-width: 1.5; }
      .store { fill: #f2f4f7; stroke: #667085; stroke-width: 1.5; }
      .learn { fill: #eef4ff; stroke: #444ce7; stroke-width: 1.5; }
      .line { stroke: #344054; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #667085; stroke-width: 1.4; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="40" y="44" class="title">Dynamic Flow Runtime UML</text>
  <text x="40" y="70" class="small">Fixed contract: 22 logical predicates. Adaptive parts: domain tags, phase topology, unit cells, transition thresholds, and learned routing confidence.</text>

  <text x="70" y="120" class="lane">Intake and Predicate Contract</text>
  <text x="410" y="120" class="lane">Dynamic Flow Pipeline</text>
  <text x="805" y="120" class="lane">Registries and Learning</text>

  <rect x="40" y="145" width="220" height="64" rx="10" class="runtime"/>
  <text x="150" y="170" text-anchor="middle" class="box-title">User / Document Input</text>
  <text x="150" y="190" text-anchor="middle" class="box-text">raw text, docs, source packets</text>

  <rect x="40" y="240" width="220" height="82" rx="10" class="predicate"/>
  <text x="150" y="266" text-anchor="middle" class="box-title">Semantic Compiler</text>
  <text x="150" y="286" text-anchor="middle" class="box-text">words to logical structure</text>
  <text x="150" y="304" text-anchor="middle" class="box-text">22-slot predicate vector</text>

  <rect x="40" y="355" width="220" height="82" rx="10" class="predicate"/>
  <text x="150" y="381" text-anchor="middle" class="box-title">Predicate Packet</text>
  <text x="150" y="401" text-anchor="middle" class="box-text">predicate counts + domain tags</text>
  <text x="150" y="419" text-anchor="middle" class="box-text">confidence + dependency edges</text>

  <rect x="335" y="145" width="230" height="64" rx="10" class="runtime"/>
  <text x="450" y="170" text-anchor="middle" class="box-title">Topology Router</text>
  <text x="450" y="190" text-anchor="middle" class="box-text">selects flow and phase topology</text>

  <rect x="335" y="240" width="230" height="64" rx="10" class="runtime"/>
  <text x="450" y="265" text-anchor="middle" class="box-title">Sub-Phase Router</text>
  <text x="450" y="285" text-anchor="middle" class="box-text">activates sub-phases by vector</text>

  <rect x="335" y="335" width="230" height="64" rx="10" class="runtime"/>
  <text x="450" y="360" text-anchor="middle" class="box-title">Domain Splitter</text>
  <text x="450" y="380" text-anchor="middle" class="box-text">array of domain packets</text>

  <rect x="335" y="430" width="230" height="64" rx="10" class="runtime"/>
  <text x="450" y="455" text-anchor="middle" class="box-title">Domain Translator</text>
  <text x="450" y="475" text-anchor="middle" class="box-text">formal predicate-language work</text>

  <rect x="335" y="525" width="230" height="64" rx="10" class="runtime"/>
  <text x="450" y="550" text-anchor="middle" class="box-title">Scheme Planner</text>
  <text x="450" y="570" text-anchor="middle" class="box-text">dependencies, wait states, order</text>

  <rect x="335" y="620" width="230" height="64" rx="10" class="runtime"/>
  <text x="450" y="645" text-anchor="middle" class="box-title">Processor and Applier Arrays</text>
  <text x="450" y="665" text-anchor="middle" class="box-text">one unit per planned task</text>

  <rect x="335" y="715" width="230" height="64" rx="10" class="gate"/>
  <text x="450" y="740" text-anchor="middle" class="box-title">Convergence Gate</text>
  <text x="450" y="760" text-anchor="middle" class="box-text">accepted, blocked, rejected, gaps</text>

  <rect x="335" y="810" width="230" height="64" rx="10" class="runtime"/>
  <text x="450" y="835" text-anchor="middle" class="box-title">Result Translator + Formatter</text>
  <text x="450" y="855" text-anchor="middle" class="box-text">predicate result to human result</text>

  <rect x="620" y="525" width="210" height="82" rx="10" class="gate"/>
  <text x="725" y="551" text-anchor="middle" class="box-title">Phase Context Compiler</text>
  <text x="725" y="571" text-anchor="middle" class="box-text">phase output to carry-forward</text>
  <text x="725" y="589" text-anchor="middle" class="box-text">predicate summary</text>

  <rect x="620" y="635" width="210" height="82" rx="10" class="gate"/>
  <text x="725" y="661" text-anchor="middle" class="box-title">Transition Gate Unit</text>
  <text x="725" y="681" text-anchor="middle" class="box-text">predicate continuity check</text>
  <text x="725" y="699" text-anchor="middle" class="box-text">PASS / GAPS / BLOCK</text>

  <rect x="620" y="745" width="210" height="82" rx="10" class="arbiter"/>
  <text x="725" y="771" text-anchor="middle" class="box-title">Arbiter Selector + Units</text>
  <text x="725" y="791" text-anchor="middle" class="box-text">hard quality boundary</text>
  <text x="725" y="809" text-anchor="middle" class="box-text">nothing overrides rejection</text>

  <rect x="620" y="855" width="210" height="64" rx="10" class="gate"/>
  <text x="725" y="880" text-anchor="middle" class="box-title">Knowledge Edge Path</text>
  <text x="725" y="900" text-anchor="middle" class="box-text">context pack, approval, adapter</text>

  <rect x="895" y="145" width="240" height="64" rx="10" class="store"/>
  <text x="1015" y="170" text-anchor="middle" class="box-title">Flow Registry</text>
  <text x="1015" y="190" text-anchor="middle" class="box-text">flow + phase topology versions</text>

  <rect x="895" y="240" width="240" height="64" rx="10" class="store"/>
  <text x="1015" y="265" text-anchor="middle" class="box-title">Unit Registry</text>
  <text x="1015" y="285" text-anchor="middle" class="box-text">cells by role, domain, version</text>

  <rect x="895" y="335" width="240" height="64" rx="10" class="store"/>
  <text x="1015" y="360" text-anchor="middle" class="box-title">Dataset Registry</text>
  <text x="1015" y="380" text-anchor="middle" class="box-text">learning pairs and conformance</text>

  <rect x="895" y="430" width="240" height="64" rx="10" class="store"/>
  <text x="1015" y="455" text-anchor="middle" class="box-title">Decision Graph</text>
  <text x="1015" y="475" text-anchor="middle" class="box-text">routing edges and confidence</text>

  <rect x="895" y="525" width="240" height="64" rx="10" class="store"/>
  <text x="1015" y="550" text-anchor="middle" class="box-title">Context Packet Store</text>
  <text x="1015" y="570" text-anchor="middle" class="box-text">versioned phase predicate summaries</text>

  <rect x="895" y="620" width="240" height="64" rx="10" class="store"/>
  <text x="1015" y="645" text-anchor="middle" class="box-title">Event Log</text>
  <text x="1015" y="665" text-anchor="middle" class="box-text">append-only run provenance</text>

  <rect x="895" y="715" width="240" height="82" rx="10" class="learn"/>
  <text x="1015" y="741" text-anchor="middle" class="box-title">Continuous Learning</text>
  <text x="1015" y="761" text-anchor="middle" class="box-text">feedback router, DPO, LoRA</text>
  <text x="1015" y="779" text-anchor="middle" class="box-text">idle gate, promotion check</text>

  <path d="M150 209 L150 240" class="line"/>
  <path d="M150 322 L150 355" class="line"/>
  <path d="M260 396 L335 177" class="line"/>
  <path d="M450 209 L450 240" class="line"/>
  <path d="M450 304 L450 335" class="line"/>
  <path d="M450 399 L450 430" class="line"/>
  <path d="M450 494 L450 525" class="line"/>
  <path d="M450 589 L450 620" class="line"/>
  <path d="M450 684 L450 715" class="line"/>
  <path d="M450 779 L450 810" class="line"/>
  <path d="M565 557 L620 566" class="line"/>
  <path d="M725 607 L725 635" class="line"/>
  <path d="M725 717 L725 745" class="line"/>
  <path d="M830 786 L895 652" class="dash"/>
  <path d="M830 566 L895 557" class="dash"/>
  <path d="M830 676 L895 557" class="dash"/>
  <path d="M565 177 L895 177" class="dash"/>
  <path d="M565 272 L895 272" class="dash"/>
  <path d="M565 367 L895 367" class="dash"/>
  <path d="M565 557 L895 462" class="dash"/>
  <path d="M1015 684 L1015 715" class="line"/>
  <path d="M895 756 L830 786" class="dash"/>
  <path d="M725 827 L725 855" class="line"/>
  <path d="M620 887 L565 842" class="dash"/>

  <rect x="40" y="910" width="1095" height="42" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="60" y="935" class="box-text">Design rule: methodology is adaptive registry data; the fixed machine contract is compiled logical structure using the 22 shared predicates plus learned domain tags and confidence.</text>
</svg>
