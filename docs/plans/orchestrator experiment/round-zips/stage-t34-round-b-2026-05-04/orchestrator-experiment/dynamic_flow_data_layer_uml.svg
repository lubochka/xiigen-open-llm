<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="900" viewBox="0 0 1250 900" role="img">
  <title>Dynamic flow data layer UML - predicate registries and phase transition entities</title>
  <desc>Entity UML for the dynamic flow data layer. It includes flow, unit, dataset, decision graph, event log, context packet store, phase topology, predicate vector, transition evidence, and phase learning gaps.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <style>
      .title { font: 700 24px Segoe UI, Arial, sans-serif; fill: #101828; }
      .sub { font: 12px Segoe UI, Arial, sans-serif; fill: #475467; }
      .head { font: 700 14px Segoe UI, Arial, sans-serif; fill: #101828; }
      .row { font: 12px Consolas, Segoe UI, monospace; fill: #344054; }
      .flow { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.3; }
      .unit { fill: #ecfdf3; stroke: #039855; stroke-width: 1.3; }
      .data { fill: #f4f3ff; stroke: #7a5af8; stroke-width: 1.3; }
      .decision { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.3; }
      .event { fill: #f2f4f7; stroke: #667085; stroke-width: 1.3; }
      .phase { fill: #fef3f2; stroke: #d92d20; stroke-width: 1.3; }
      .line { stroke: #344054; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #667085; stroke-width: 1.2; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="40" y="44" class="title">Dynamic Flow Data Layer UML</text>
  <text x="40" y="68" class="sub">The storage model keeps methodology adaptive. Phase labels and domain tags are data; predicate vectors remain the shared machine contract.</text>

  <rect x="40" y="100" width="260" height="150" rx="10" class="flow"/>
  <text x="170" y="125" text-anchor="middle" class="head">FlowRegistry.TopologyContract</text>
  <text x="60" y="152" class="row">flowId</text>
  <text x="60" y="172" class="row">topologyKind: request | phase</text>
  <text x="60" y="192" class="row">nodes[]: NodeDef</text>
  <text x="60" y="212" class="row">edges[]: EdgeDef</text>
  <text x="60" y="232" class="row">versionPointer</text>

  <rect x="40" y="285" width="260" height="145" rx="10" class="flow"/>
  <text x="170" y="310" text-anchor="middle" class="head">PhaseTopology</text>
  <text x="60" y="337" class="row">methodologyId</text>
  <text x="60" y="357" class="row">phaseNodes[]</text>
  <text x="60" y="377" class="row">transitionEdges[]</text>
  <text x="60" y="397" class="row">semanticThresholds[]</text>
  <text x="60" y="417" class="row">companyVersion</text>

  <rect x="355" y="100" width="260" height="150" rx="10" class="unit"/>
  <text x="485" y="125" text-anchor="middle" class="head">UnitRegistry.Cell</text>
  <text x="375" y="152" class="row">cellId</text>
  <text x="375" y="172" class="row">role</text>
  <text x="375" y="192" class="row">domainTagSet</text>
  <text x="375" y="212" class="row">predicateContract</text>
  <text x="375" y="232" class="row">trustScore + version</text>

  <rect x="355" y="285" width="260" height="145" rx="10" class="unit"/>
  <text x="485" y="310" text-anchor="middle" class="head">RoleDomainSlot</text>
  <text x="375" y="337" class="row">role</text>
  <text x="375" y="357" class="row">domainTagSet</text>
  <text x="375" y="377" class="row">activeCellId</text>
  <text x="375" y="397" class="row">fallbackCellIds[]</text>
  <text x="375" y="417" class="row">conformanceSuiteId</text>

  <rect x="670" y="100" width="260" height="150" rx="10" class="data"/>
  <text x="800" y="125" text-anchor="middle" class="head">PredicateVector</text>
  <text x="690" y="152" class="row">predicateCounts[22]</text>
  <text x="690" y="172" class="row">domainTags[]</text>
  <text x="690" y="192" class="row">confidence</text>
  <text x="690" y="212" class="row">dependencyEdges[]</text>
  <text x="690" y="232" class="row">sourceEvidenceIds[]</text>

  <rect x="670" y="285" width="260" height="145" rx="10" class="data"/>
  <text x="800" y="310" text-anchor="middle" class="head">DatasetRegistry.CorpusSlice</text>
  <text x="690" y="337" class="row">sliceId</text>
  <text x="690" y="357" class="row">role + domainTagSet</text>
  <text x="690" y="377" class="row">learningPairs[]</text>
  <text x="690" y="397" class="row">sourceTrust</text>
  <text x="690" y="417" class="row">trainedCells[]</text>

  <rect x="985" y="100" width="230" height="150" rx="10" class="decision"/>
  <text x="1100" y="125" text-anchor="middle" class="head">DecisionGraph.RoutingEdge</text>
  <text x="1005" y="152" class="row">edgeId</text>
  <text x="1005" y="172" class="row">fromSignature</text>
  <text x="1005" y="192" class="row">toRoleDomainSlot</text>
  <text x="1005" y="212" class="row">confidence</text>
  <text x="1005" y="232" class="row">observations</text>

  <rect x="985" y="285" width="230" height="145" rx="10" class="decision"/>
  <text x="1100" y="310" text-anchor="middle" class="head">KnnMemoryEntry</text>
  <text x="1005" y="337" class="row">predicateVectorId</text>
  <text x="1005" y="357" class="row">neighborId</text>
  <text x="1005" y="377" class="row">arbiterStatus</text>
  <text x="1005" y="397" class="row">positive | warning | rejected</text>
  <text x="1005" y="417" class="row">failureReason</text>

  <rect x="40" y="495" width="260" height="150" rx="10" class="phase"/>
  <text x="170" y="520" text-anchor="middle" class="head">ContextPacketStore</text>
  <text x="60" y="547" class="row">contextPacketId</text>
  <text x="60" y="567" class="row">phaseRunId</text>
  <text x="60" y="587" class="row">predicateSummaryIds[]</text>
  <text x="60" y="607" class="row">transitionRole</text>
  <text x="60" y="627" class="row">version + source run</text>

  <rect x="355" y="495" width="260" height="150" rx="10" class="phase"/>
  <text x="485" y="520" text-anchor="middle" class="head">TransitionEvidence</text>
  <text x="375" y="547" class="row">transitionId</text>
  <text x="375" y="567" class="row">upstreamContextId</text>
  <text x="375" y="587" class="row">downstreamVectorId</text>
  <text x="375" y="607" class="row">similarityScores[]</text>
  <text x="375" y="627" class="row">verdict: PASS | GAPS | BLOCK</text>

  <rect x="670" y="495" width="260" height="150" rx="10" class="phase"/>
  <text x="800" y="520" text-anchor="middle" class="head">PhaseLearningGap</text>
  <text x="690" y="547" class="row">gapId</text>
  <text x="690" y="567" class="row">phaseId + subPhaseId</text>
  <text x="690" y="587" class="row">missingPredicateVectorId</text>
  <text x="690" y="607" class="row">targetCellRole</text>
  <text x="690" y="627" class="row">feedbackSignal</text>

  <rect x="985" y="495" width="230" height="150" rx="10" class="event"/>
  <text x="1100" y="520" text-anchor="middle" class="head">EventLog.EventRecord</text>
  <text x="1005" y="547" class="row">eventId + timestamp</text>
  <text x="1005" y="567" class="row">sourceEntity</text>
  <text x="1005" y="587" class="row">parentState</text>
  <text x="1005" y="607" class="row">childState</text>
  <text x="1005" y="627" class="row">trustScoreAtTime</text>

  <rect x="355" y="705" width="575" height="95" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="642" y="733" text-anchor="middle" class="head">Core data rule</text>
  <text x="375" y="760" class="sub">Do not store methodology as code. Store topology versions, predicate vectors, domain tags, evidence, and trust-scored cell versions.</text>
  <text x="375" y="782" class="sub">Learning updates pointers, confidence, corpus slices, and conformance suites; all mutations append to the event log.</text>

  <path d="M300 175 L355 175" class="line"/>
  <path d="M300 357 L355 357" class="line"/>
  <path d="M615 175 L670 175" class="line"/>
  <path d="M615 357 L670 357" class="line"/>
  <path d="M930 175 L985 175" class="line"/>
  <path d="M930 357 L985 357" class="line"/>
  <path d="M170 430 L170 495" class="line"/>
  <path d="M300 570 L355 570" class="line"/>
  <path d="M615 570 L670 570" class="line"/>
  <path d="M930 570 L985 570" class="line"/>
  <path d="M1100 645 L1100 705 L930 752" class="dash"/>
  <path d="M800 645 L800 705" class="dash"/>
  <path d="M485 645 L485 705" class="dash"/>
</svg>
