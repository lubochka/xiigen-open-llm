<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820" role="img">
  <title>Continuous learning integration - predicate-level feedback paths</title>
  <desc>Continuous learning UML showing real-time arbiter feedback, idle scheduled learning, gap-driven cell creation, and phase-transition learning using predicate-vector evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <style>
      .title { font: 700 24px Segoe UI, Arial, sans-serif; fill: #101828; }
      .lane { font: 700 15px Segoe UI, Arial, sans-serif; fill: #475467; }
      .box-title { font: 700 14px Segoe UI, Arial, sans-serif; fill: #101828; }
      .box-text { font: 12px Segoe UI, Arial, sans-serif; fill: #344054; }
      .real { fill: #ecfdf3; stroke: #039855; stroke-width: 1.4; }
      .idle { fill: #eef4ff; stroke: #444ce7; stroke-width: 1.4; }
      .gap { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.4; }
      .phase { fill: #fef3f2; stroke: #d92d20; stroke-width: 1.4; }
      .store { fill: #f2f4f7; stroke: #667085; stroke-width: 1.4; }
      .line { stroke: #344054; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #667085; stroke-width: 1.2; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="40" y="44" class="title">Continuous Learning Integration</text>
  <text x="40" y="70" class="box-text">All learning signals are stored as predicate-vector evidence before they update cells, registries, or phase-transition confidence.</text>

  <text x="70" y="120" class="lane">Path 1 - Real-Time Request Feedback</text>
  <text x="70" y="325" class="lane">Path 2 - Idle Scheduled Learning</text>
  <text x="70" y="530" class="lane">Path 3 - Gap-Driven Cell Creation</text>
  <text x="760" y="120" class="lane">Phase-Level Learning</text>

  <rect x="60" y="145" width="170" height="62" rx="10" class="real"/>
  <text x="145" y="171" text-anchor="middle" class="box-title">Pipeline Run</text>
  <text x="145" y="191" text-anchor="middle" class="box-text">predicate trace produced</text>

  <rect x="285" y="145" width="170" height="62" rx="10" class="real"/>
  <text x="370" y="171" text-anchor="middle" class="box-title">Arbiter Verdicts</text>
  <text x="370" y="191" text-anchor="middle" class="box-text">accept, concern, reprocess</text>

  <rect x="510" y="145" width="170" height="62" rx="10" class="store"/>
  <text x="595" y="171" text-anchor="middle" class="box-title">Event Log</text>
  <text x="595" y="191" text-anchor="middle" class="box-text">append full evidence</text>

  <rect x="60" y="350" width="170" height="62" rx="10" class="idle"/>
  <text x="145" y="376" text-anchor="middle" class="box-title">Idle Detector</text>
  <text x="145" y="396" text-anchor="middle" class="box-text">machine is safe to train</text>

  <rect x="285" y="350" width="170" height="62" rx="10" class="idle"/>
  <text x="370" y="376" text-anchor="middle" class="box-title">Feedback Router</text>
  <text x="370" y="396" text-anchor="middle" class="box-text">accepted, edited, rejected</text>

  <rect x="510" y="350" width="170" height="62" rx="10" class="idle"/>
  <text x="595" y="376" text-anchor="middle" class="box-title">Dataset Curator</text>
  <text x="595" y="396" text-anchor="middle" class="box-text">corpus slice updates</text>

  <rect x="60" y="555" width="170" height="62" rx="10" class="gap"/>
  <text x="145" y="581" text-anchor="middle" class="box-title">Gap Detector</text>
  <text x="145" y="601" text-anchor="middle" class="box-text">sustained low confidence</text>

  <rect x="285" y="555" width="170" height="62" rx="10" class="gap"/>
  <text x="370" y="581" text-anchor="middle" class="box-title">Learning Gap Packet</text>
  <text x="370" y="601" text-anchor="middle" class="box-text">missing predicate evidence</text>

  <rect x="510" y="555" width="170" height="62" rx="10" class="gap"/>
  <text x="595" y="581" text-anchor="middle" class="box-title">Create or Fetch Cell</text>
  <text x="595" y="601" text-anchor="middle" class="box-text">trust-tier search</text>

  <rect x="735" y="350" width="170" height="62" rx="10" class="idle"/>
  <text x="820" y="376" text-anchor="middle" class="box-title">LoRA Trainer</text>
  <text x="820" y="396" text-anchor="middle" class="box-text">incremental update</text>

  <rect x="960" y="350" width="170" height="62" rx="10" class="idle"/>
  <text x="1045" y="376" text-anchor="middle" class="box-title">Promotion Gate</text>
  <text x="1045" y="396" text-anchor="middle" class="box-text">after accuracy greater</text>

  <rect x="735" y="145" width="170" height="62" rx="10" class="phase"/>
  <text x="820" y="171" text-anchor="middle" class="box-title">Transition Evidence</text>
  <text x="820" y="191" text-anchor="middle" class="box-text">upstream vs downstream</text>

  <rect x="960" y="145" width="170" height="62" rx="10" class="phase"/>
  <text x="1045" y="171" text-anchor="middle" class="box-title">Phase Learning Gap</text>
  <text x="1045" y="191" text-anchor="middle" class="box-text">phase and sub-phase owned</text>

  <rect x="735" y="555" width="170" height="62" rx="10" class="store"/>
  <text x="820" y="581" text-anchor="middle" class="box-title">Unit Registry</text>
  <text x="820" y="601" text-anchor="middle" class="box-text">probationary cell</text>

  <rect x="960" y="555" width="170" height="62" rx="10" class="store"/>
  <text x="1045" y="581" text-anchor="middle" class="box-title">Decision Graph</text>
  <text x="1045" y="601" text-anchor="middle" class="box-text">confidence updated</text>

  <path d="M230 176 L285 176" class="line"/>
  <path d="M455 176 L510 176" class="line"/>
  <path d="M595 207 L595 350" class="dash"/>
  <path d="M230 381 L285 381" class="line"/>
  <path d="M455 381 L510 381" class="line"/>
  <path d="M680 381 L735 381" class="line"/>
  <path d="M905 381 L960 381" class="line"/>
  <path d="M1045 412 L1045 555" class="dash"/>
  <path d="M230 586 L285 586" class="line"/>
  <path d="M455 586 L510 586" class="line"/>
  <path d="M680 586 L735 586" class="line"/>
  <path d="M905 586 L960 586" class="dash"/>
  <path d="M680 176 L735 176" class="dash"/>
  <path d="M905 176 L960 176" class="line"/>
  <path d="M1045 207 L1045 350" class="dash"/>
  <path d="M370 617 L370 690 L595 690 L595 412" class="dash"/>

  <rect x="60" y="700" width="1070" height="58" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="80" y="725" class="box-text">Learning rule: every accepted, edited, rejected, gap, and transition verdict becomes predicate-level evidence before any retraining or promotion.</text>
  <text x="80" y="745" class="box-text">Promotion rule: a new cell becomes active only after conformance and after-accuracy improve over before-accuracy.</text>
</svg>
